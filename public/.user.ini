; Backstop for photo uploads (stories/profile photos) — the real fix for a
; 413 on upload is raising Nginx's client_max_body_size, which this file
; can't touch. This just makes sure PHP-FPM's own per-file/per-request
; limits aren't the bottleneck once Nginx lets the request through.
;
; Livewire sends every selected file in ONE multipart request, not one
; request per file — so post_max_size has to cover the whole batch, not
; just the largest single photo. upload_max_filesize only needs to cover
; one file at a time (PHP checks it per-file while parsing the batch).
upload_max_filesize = 25M
post_max_size = 100M
